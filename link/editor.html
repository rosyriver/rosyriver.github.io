<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>joyseen · 清单编辑室</title><link rel="stylesheet" href="editor.css?v=selected-row-20261107"></head><body>
<header class="top"><a class="brand" href="./">joyseen<span> 编辑台</span></a><div class="actions"><button id="undo" disabled>撤销</button><button id="import">导入</button><button id="backup">备份</button><button id="export" class="primary">导出 HTML</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<div class="studio-intro"><span id="status" role="status"></span></div>
<div class="mobile-switch" role="group" aria-label="视图切换"><button id="edit-view" class="active">编辑内容</button><button id="preview-view">查看预览</button></div>
<main class="workspace"><section class="editing" aria-label="内容编辑"><div id="errors" role="alert" hidden></div>
<details class="profile" open>
  <summary><strong>个人名片</strong><span class="disclosure-chevron" aria-hidden="true"></span></summary>
  <div class="profile-fields">
    <label><span>昵称</span><input id="nickname" maxlength="80"></label>
    <label><span>一句话简介</span><input id="bio" maxlength="240"></label>
    <label class="profile-disclosure"><span>页脚说明</span><textarea id="disclosure" rows="1" maxlength="1000"></textarea></label>
  </div>
</details>
<div class="section-title tool-list-heading">
  <h2>工具清单</h2>
  <div class="collection-actions">
    <button type="button" id="add-category">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 11v5m-2.5-2.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      新分类
    </button>
    <button type="button" id="add-tool" class="primary" disabled>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      添加
    </button>
  </div>
</div>
<nav id="category-tabs" aria-label="编辑分类"></nav><div id="groups"></div><p class="bottom-note">草稿自动保存在此浏览器<br>点击「备份」下载 JSON，交给本地发布脚本。</p></section>
<section class="preview-pane" aria-label="页面预览"><div class="preview-head"><span><i></i> 实时预览</span></div><iframe id="preview" title="静态页面实时预览" sandbox="allow-scripts"></iframe></section></main><div id="toast" role="status" hidden></div>
<script src="content.js?v=e11b025324763830"></script><script src="page-style.js?v=row-hover-20261107"></script><script src="editor-core.js?v=published-initial-20261107"></script><script src="editor.js?v=compact-profile-20261107"></script></body></html>
