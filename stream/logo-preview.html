<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketMoment 标志预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #f7efe2; color: #2d2926; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .intro { width: min(880px, calc(100% - 40px)); margin: 0 auto; padding: 58px 0 34px; border-bottom: 1px solid rgba(66,54,45,.18); }
  .intro small { display: block; margin-bottom: 8px; color: #9a6f69; font-size: 11px; font-weight: 750; }
  .intro h1 { font-family: Georgia, serif; font-size: 26px; font-weight: 500; }
  .options { width: min(880px, calc(100% - 40px)); margin: 0 auto; }
  .option { min-height: 250px; display: grid; grid-template-columns: 170px 1fr; align-items: center; border-bottom: 1px solid rgba(66,54,45,.18); }
  .number { color: #a8867c; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  .header-demo { width: 100%; min-height: 90px; display: flex; align-items: center; padding: 22px 28px; border: 1px solid rgba(72,58,49,.14); background: rgba(255,253,248,.82); box-shadow: 0 8px 24px rgba(78,61,49,.06); }
  .editorial { display: inline-flex; align-items: baseline; color: #282421; white-space: nowrap; }
  .editorial .pocket { font-family: Georgia, "Times New Roman", serif; font-size: 27px; font-weight: 400; font-style: italic; }
  .editorial .moment { margin-left: 2px; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-size: 22px; font-weight: 720; }
  .editorial .sub { position: relative; top: -1px; margin-left: 13px; padding-left: 13px; color: #9a6f69; font-size: 10px; font-weight: 700; }
  .editorial .sub::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 2px; width: 1px; background: rgba(72,58,49,.24); }
  .handwritten { position: relative; display: inline-flex; align-items: baseline; padding: 0 4px 8px 1px; color: #302823; white-space: nowrap; }
  .handwritten .name { font-family: "Ink Free", "Segoe Print", cursive; font-size: 29px; line-height: 1; font-weight: 600; }
  .handwritten .sub { margin-left: 13px; color: #9a6f69; font-family: "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; }
  .handwritten::after { content: ""; position: absolute; left: 0; bottom: 2px; width: 158px; height: 5px; border-top: 1.5px solid rgba(154,111,105,.72); border-radius: 50%; transform: rotate(-1.2deg); }
  .fountain { position: relative; display: inline-flex; align-items: baseline; padding: 0 6px 7px 0; color: #342b27; white-space: nowrap; }
  .fountain .name { font-family: Gabriola, "Lucida Handwriting", cursive; font-size: 38px; line-height: .8; }
  .fountain .sub, .pencil .sub, .signature .sub, .marker .sub { margin-left: 13px; color: #9a6f69; font-size: 10px; font-weight: 700; }
  .fountain::after { content: ""; position: absolute; left: 7px; bottom: 0; width: 176px; height: 8px; border-top: 1px solid rgba(72,58,49,.64); border-radius: 50%; transform: rotate(-1.8deg); }
  .pencil { display: inline-flex; align-items: baseline; color: #615b56; white-space: nowrap; transform: rotate(-.45deg); }
  .pencil .name { position: relative; font-family: "Segoe Print", cursive; font-size: 25px; font-weight: 400; }
  .pencil .name::after { content: ""; position: absolute; left: -2px; right: -3px; bottom: -5px; height: 4px; border-top: 1px solid rgba(96,88,81,.5); border-bottom: 1px solid rgba(96,88,81,.18); transform: rotate(.6deg); }
  .signature { display: inline-flex; align-items: baseline; color: #2f2925; white-space: nowrap; }
  .signature .name { font-family: "Lucida Handwriting", "Segoe Print", cursive; font-size: 23px; font-style: italic; }
  .signature .dot { width: 5px; height: 5px; margin: 0 1px 1px 5px; border-radius: 50%; background: #a36f68; }
  .marker { position: relative; display: inline-flex; align-items: baseline; color: #282320; white-space: nowrap; }
  .marker::before { content: ""; position: absolute; z-index: 0; left: -5px; bottom: 1px; width: 174px; height: 10px; border-radius: 3px 8px 4px 6px; background: rgba(220,167,154,.32); transform: rotate(-1.3deg); }
  .marker .name { position: relative; z-index: 1; font-family: "Segoe Print", cursive; font-size: 25px; font-weight: 700; }
  .marker .sub { position: relative; z-index: 1; }
  @media (max-width: 640px) {
    .intro { padding-top: 36px; }
    .option { grid-template-columns: 1fr; gap: 14px; padding: 28px 0; }
    .header-demo { padding: 20px; overflow: hidden; }
    .editorial .sub, .handwritten .sub { margin-left: 9px; }
  }
</style>
</head>
<body>
  <header class="intro">
    <small>POCKETMOMENT / WORDMARK STUDY</small>
    <h1>左上角标志方案</h1>
  </header>
  <main class="options">
    <section class="option">
      <div class="number">01 / 编辑签名风</div>
      <div class="header-demo">
        <div class="editorial"><span class="pocket">Pocket</span><span class="moment">Moment</span><span class="sub">个人动态</span></div>
      </div>
    </section>
    <section class="option">
      <div class="number">02 / 手写批注风</div>
      <div class="header-demo">
        <div class="handwritten"><span class="name">PocketMoment</span><span class="sub">个人动态</span></div>
      </div>
    </section>
    <section class="option">
      <div class="number">03 / 钢笔连写风</div>
      <div class="header-demo">
        <div class="fountain"><span class="name">PocketMoment</span><span class="sub">个人动态</span></div>
      </div>
    </section>
    <section class="option">
      <div class="number">04 / 铅笔旁注风</div>
      <div class="header-demo">
        <div class="pencil"><span class="name">PocketMoment</span><span class="sub">个人动态</span></div>
      </div>
    </section>
    <section class="option">
      <div class="number">05 / 签字笔落款</div>
      <div class="header-demo">
        <div class="signature"><span class="name">PocketMoment</span><span class="dot"></span><span class="sub">个人动态</span></div>
      </div>
    </section>
    <section class="option">
      <div class="number">06 / 轻记号笔风</div>
      <div class="header-demo">
        <div class="marker"><span class="name">PocketMoment</span><span class="sub">个人动态</span></div>
      </div>
    </section>
  </main>
</body>
</html>
