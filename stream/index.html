    if (!el) return false;
    document.querySelectorAll('.list_item.moment_target').forEach(function(item){ item.classList.remove('moment_target'); });
    el.classList.add('moment_target');
    centerMoment(el, 'smooth');
    requestAnimationFrame(function(){ centerMoment(el, 'auto'); });
    [180, 520, 1100].forEach(function(delay) {
      setTimeout(function(){ centerMoment(el, 'auto'); }, delay);
    });
    el.querySelectorAll('img, video').forEach(function(media) {
      if (media.tagName === 'IMG' && media.complete) return;
      media.addEventListener(media.tagName === 'IMG' ? 'load' : 'loadedmetadata', function(){ centerMoment(el, 'auto'); }, { once: true });
    });
    return true;
  }
  function centerMoment(el, behavior) {
    var rect = el.getBoundingClientRect();
    var viewportHeight = window.innerHeight || document.documentElement.clientHeight;
    var header = document.querySelector('.header');
    var headerHeight = header ? header.getBoundingClientRect().height : 0;
    var visibleCenter = headerHeight + Math.max(0, viewportHeight - headerHeight) / 2;
    var pageY = window.pageYOffset || document.documentElement.scrollTop || 0;
    var targetTop = pageY + rect.top + rect.height / 2 - visibleCenter;
    var maxTop = Math.max(0, document.documentElement.scrollHeight - viewportHeight);
    window.scrollTo({ top: Math.max(0, Math.min(targetTop, maxTop)), behavior: behavior || 'auto' });
  }
  function loadDataPage(page) {
    if (loadedPages[page]) return Promise.resolve(true);
    if (loadingPages[page]) return loadingPages[page];
    loadingPages[page] = fetch(new URL(dataPageUrlPrefix + page + '.json', location.href).toString(), { credentials: 'same-origin' })
      .then(function(r) { if (!r.ok) throw Error(); return r.json(); })
      .then(function(data) {
        loadedPages[page] = true;
        currentPage = Math.max(currentPage, page);
        totalPages = data.totalPages || totalPages;
        appendItems(data.items || []);
        updateAutoLoader();
        maybeLoadNextPage();
        return true;
      }).catch(function(err) {
        updateAutoLoader();
        throw err;
      }).finally(function() {
        delete loadingPages[page];
      });
    return loadingPages[page];
  }
  function ensureMomentLoaded(id) {
    if (hasLoadedMoment(id)) return Promise.resolve(true);
    var page = 2;
    function next() {
      if (hasLoadedMoment(id)) return Promise.resolve(true);
      if (page > totalPages) return Promise.resolve(false);
      return loadDataPage(page++).then(next).catch(function(){ return false; });
    }
    return next();
  }
  function focusMomentFromUrl() {
    var id = getMomentIdFromUrl();
    if (!id) return Promise.resolve(false);
    clearSearchForMoment();
    if (scrollToMoment(id)) return Promise.resolve(true);
    return ensureMomentLoaded(id).then(function(found) {
      if (!found) {
        notify('没有找到这条瞬间', 'error');
        return false;
      }
      renderList(allItems);
      setTimeout(function(){ scrollToMoment(id); }, 30);
      return true;
    });
  }

  function loadMore() {
    loadDataPage(currentPage + 1).catch(function() {});
  }
  window.loadMore = loadMore;

  function hasMorePages() {
    return !isSearchActive() && currentPage < totalPages;
  }
  function updateAutoLoader() {
    if (!autoLoadSentinel) return;
    autoLoadSentinel.style.display = hasMorePages() ? 'block' : 'none';
  }
  function maybeLoadNextPage() {
    if (!hasMorePages() || loadingPages[currentPage + 1]) return;
    var doc = document.documentElement;
    var scrollTop = window.pageYOffset || doc.scrollTop || 0;
    var viewport = window.innerHeight || doc.clientHeight || 0;
    var remain = doc.scrollHeight - (scrollTop + viewport);
    if (remain < Math.max(480, viewport * 0.7)) loadMore();
  }
  if (autoLoadSentinel && 'IntersectionObserver' in window) {
    var autoLoadObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) loadMore();
      });
    }, { root: null, rootMargin: '700px 0px', threshold: 0 });
    autoLoadObserver.observe(autoLoadSentinel);
  }
  window.addEventListener('scroll', maybeLoadNextPage, { passive: true });
  window.addEventListener('resize', maybeLoadNextPage);

  function checkHasMore() {
    updateAutoLoader();
    maybeLoadNextPage();
  }

  renderList(allItems);
  checkHasMore();
  container.addEventListener('click', function(e) {
    var btn = e.target.closest ? e.target.closest('[data-share-moment-id]') : null;
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    shareMoment(btn.getAttribute('data-share-moment-id'));
  });
  if (shareUrlButton) {
    shareUrlButton.addEventListener('click', function(e) {
      e.preventDefault();
      copyActiveShareUrl();
    });
  }
  if (shareOverlay) {
    shareOverlay.addEventListener('click', function(e) {
      if (e.target === shareOverlay || (e.target.closest && e.target.closest('[data-share-close]'))) {
        closeShareCard();
      }
    });
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeShareCard();
  });
  window.addEventListener('hashchange', function(){ focusMomentFromUrl(); });

  var manifestPromise, shardsPromise, indexItems = [], resultLimit = 80;
  function syncUrl(q) { try { var u=new URL(location.href); q?u.searchParams.set('q',q):u.searchParams.delete('q'); history.replaceState(null,'',u.toString()) } catch(e){} }
  function loadManifest() { if(manifestPromise)return manifestPromise; manifestPromise=fetch(new URL(manifestUrl,location.href).toString(),{credentials:'same-origin'}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(m){resultLimit=m.result_limit||resultLimit;return m}); return manifestPromise }
  function loadIndex() { if(shardsPromise)return shardsPromise; shardsPromise=loadManifest().then(function(m){return Promise.all((m.shards||[]).map(function(s){return fetch(new URL(s.url,location.origin).toString(),{credentials:'same-origin'}).then(function(r){if(!r.ok)throw Error();return r.json()})}))}).then(function(shards){indexItems=[];shards.forEach(function(s){if(Array.isArray(s.items))indexItems=indexItems.concat(s.items)});return indexItems}); return shardsPromise }
  function update() { var q=normalize(input.value); syncUrl(q); if(!q){renderList(allItems);checkHasMore();return} updateAutoLoader(); if(count)count.textContent='搜索中...'; loadIndex().then(function(all){var active=normalize(input.value),terms=active.split(/\s+/).filter(Boolean);if(!terms.length){update();return} var matches=all.filter(function(i){var h=normalize(i.search||i.text||i.title);return terms.every(function(t){return h.indexOf(t)!==-1})}); container.innerHTML=matches.slice(0,resultLimit).map(function(i){return buildItemHtml({id:i.id,type:(i.type||'').trim(),content:(i.text||i.title||''),date:i.date||'',tags:i.tags||[],pinned:i.pinned,link_image:i.link_image,link_title:i.link_title,link_description:i.link_description,url:i.external_url||i.url||''})}).join('')||'<div class="empty_state">没有找到匹配的瞬间。</div>'; checkExpandButtons(); if(count)count.textContent=matches.length+' / '+all.length }).catch(function(){if(count)count.textContent='搜索索引加载失败'}) }
  var iq=''; try{if(!getMomentIdFromUrl())iq=new URLSearchParams(location.search).get('q')||''}catch(e){} if(iq)input.value=iq; input.addEventListener('input',update); if(iq)update(); else focusMomentFromUrl();
})();
</script>
</body>
