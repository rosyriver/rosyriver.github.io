<style>
  .shell { width: min(1120px, 100%); margin: 0 auto; padding: 28px; display: block !important; }
  .stream_content { max-width: 600px; margin: 0 auto; }
  .search_wrap { margin-bottom: 20px; position: relative; }
  .search_input { width: 100%; min-height: 46px; padding: 11px 14px 11px 39px; border: 2px solid rgba(39,48,59,0.62); border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; background: #fffdf8; color: #27303b; }
  .search_input:focus { border-color: var(--blue, #8298bb); }
  .search_icon { position: absolute; left: 14px; top: 23px; transform: translateY(-50%); color: #737b84; font-size: 14px; pointer-events: none; }
  .search_count { margin-top: 7px; font-size: 12px; font-weight: 700; color: #737b84; }
  .link_card { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin: 10px auto; border: 2px solid rgba(39,48,59,0.18); border-radius: 7px; background: #fffef9; text-decoration: none; max-width: 400px; }
  .link_card img { width: 120px; height: 80px; border-radius: 5px; object-fit: cover; flex-shrink: 0; }
  .link_card_title { font-size: 13px; font-weight: 800; color: #27303b; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .stream_share_overlay { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(24, 27, 31, 0.44); backdrop-filter: blur(14px); }
  .stream_share_overlay.show { display: flex; }
  .stream_share_dialog { width: min(520px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 18px; border: 1px solid rgba(39,48,59,0.18); border-radius: 22px; background: #fbfaf7; box-shadow: 0 26px 70px rgba(20,24,30,0.24); }
  .stream_share_head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
  .stream_share_title { font-size: 13px; font-weight: 900; color: #27303b; letter-spacing: 0.02em; }
  .stream_share_close { width: 34px; height: 34px; border: 1px solid rgba(39,48,59,0.2); border-radius: 50%; background: #fff; color: #27303b; cursor: pointer; font-size: 18px; line-height: 1; }
  .stream_share_url { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1px solid rgba(39,48,59,0.18); border-radius: 14px; background: #fff; color: #27303b; cursor: pointer; text-align: left; font-family: inherit; box-shadow: 0 8px 20px rgba(39,48,59,0.06); }
  .stream_share_url span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 750; color: #59606a; }
  .stream_share_url strong { flex: 0 0 auto; padding: 5px 9px; border-radius: 999px; background: #27303b; color: #fff; font-size: 11px; }
  .stream_share_card { position: relative; overflow: hidden; margin-top: 14px; min-height: 520px; padding: 30px; border: 1px solid rgba(39,48,59,0.16); border-radius: 24px; background:
    linear-gradient(rgba(255,255,255,0.75) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.75) 1px, transparent 1px),
    linear-gradient(145deg, #fffaf2 0%, #fff 46%, #eef7f2 100%);
    background-size: 28px 28px, 28px 28px, auto; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.78), 0 18px 45px rgba(39,48,59,0.12); color: #27303b; }
  .stream_share_card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 9px; background: linear-gradient(90deg, #df8d84, #8fbbae 44%, #ead782); }
  .stream_share_card::after { content: ""; position: absolute; right: 26px; bottom: 24px; width: 86px; height: 86px; border: 1px solid rgba(39,48,59,0.12); border-radius: 24px; transform: rotate(7deg); opacity: 0.5; }
  .stream_share_brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 30px; font-weight: 950; }
  .stream_share_brand small { color: #737b84; font-size: 11px; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .stream_share_type { display: inline-flex; align-items: center; width: fit-content; margin-bottom: 16px; padding: 5px 10px; border: 1px solid rgba(39,48,59,0.14); border-radius: 999px; background: rgba(255,255,255,0.78); color: #4f7e6c; font-size: 12px; font-weight: 900; }
  .stream_share_card_title { margin-bottom: 12px; font-size: 22px; line-height: 1.35; font-weight: 950; letter-spacing: 0; }
  .stream_share_card_text { font-size: 18px; line-height: 1.76; font-weight: 650; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
  .stream_share_media { margin: 18px 0 0; width: 100%; max-height: 160px; overflow: hidden; border-radius: 16px; border: 1px solid rgba(39,48,59,0.14); background: rgba(255,255,255,0.62); }
  .stream_share_media img { display: block; width: 100%; height: 160px; object-fit: cover; }
  .stream_share_tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 20px; }
  .stream_share_tags span { padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,0.76); color: #737b84; font-size: 12px; font-weight: 850; }
  .stream_share_foot { position: absolute; left: 30px; right: 30px; bottom: 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; color: #737b84; font-size: 12px; font-weight: 850; }
  .stream_share_mark { color: #27303b; font-size: 14px; font-weight: 950; }
  html.moment_focus_active { overflow-anchor: none; }
  .auto_load_sentinel { display: none; height: 1px; margin: 22px 0 2px; pointer-events: none; }
  .auto_load_sentinel_top { margin: 0 0 22px; }
  .stream_search_meta { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 7px; }
  .stream_search_meta .search_count { margin-top: 0; }
  .stream_discovery_actions { display: flex; align-items: center; gap: 8px; }
  .stream_discovery_action { font-size: 12px; }
  .stream_time_rail { position: fixed; z-index: 30; top: 92px; left: calc(50% + 356px); width: 108px; max-height: calc(100vh - 118px); overflow: auto; padding: 2px 0 4px 15px; border-left: 1px solid var(--line, rgba(39,48,59,0.18)); color: var(--text, #27303b); scrollbar-width: none; }
  .stream_time_rail::-webkit-scrollbar { display: none; }
  .stream_time_title { margin-bottom: 9px; color: var(--muted, #737b84); font-size: 10px; font-weight: 800; letter-spacing: 0.12em; }
  .stream_time_returns, .stream_years { display: flex; flex-direction: column; align-items: stretch; }
  .stream_time_action, .stream_year_button { appearance: none; width: 100%; border: 0; background: transparent; color: inherit; cursor: pointer; font-family: inherit; text-align: left; }
  .stream_time_action { display: flex; align-items: center; gap: 7px; padding: 5px 0; font-size: 11px; font-weight: 700; }
  .stream_time_action[hidden] { display: none; }
  .stream_time_action:hover, .stream_time_action:focus-visible, .stream_year_button:hover, .stream_year_button:focus-visible { color: var(--text, #27303b); outline: none; }
  .stream_today_count { min-width: 15px; font-size: 9px; line-height: 1; text-align: center; }
  .stream_today_count:empty { display: none; }
  .stream_time_rule { height: 1px; margin: 8px 0; background: var(--line, rgba(39,48,59,0.14)); }
  .stream_time_rule[hidden] { display: none; }
  .stream_year_button { position: relative; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 4px 0; color: var(--muted, #737b84); font-size: 11px; line-height: 1.4; }
  .stream_year_button::before { content: ""; position: absolute; left: -19px; top: 50%; width: 7px; height: 1px; background: var(--line, rgba(39,48,59,0.28)); transition: width .15s, background .15s; }
  .stream_year_button small { color: var(--faint, #9a9a9a); font-size: 9px; font-weight: 650; }
  .stream_year_button.is_active { color: var(--text, #27303b); font-weight: 850; }
  .stream_year_button.is_active::before { width: 12px; background: currentColor; }
  .stream_time_returns { margin-top: 2px; }
  .stream_time_returns .stream_time_action { color: var(--muted, #737b84); font-size: 11px; }
  .list_item.moment_target { outline: 3px solid rgba(79,126,108,.48); outline-offset: 3px; }
  @media (max-width: 960px) {
    .stream_time_rail { position: static; width: 100%; max-height: none; margin: -7px 0 16px; padding: 0 0 10px; border-left: 0; border-bottom: 1px solid var(--line, rgba(39,48,59,0.18)); }
    .stream_time_title, .stream_time_rule { display: none; }
    .stream_time_returns { position: fixed; z-index: 120; right: 16px; bottom: 16px; margin: 0; }
    .stream_time_returns .stream_time_action { display: grid; place-items: center; width: 38px; height: 38px; padding: 0; overflow: hidden; border: 1px solid var(--line, rgba(39,48,59,.18)); border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 5px 18px rgba(39,48,59,.1); color: transparent; font-size: 0; backdrop-filter: blur(10px); }
    .stream_time_returns .stream_time_action[hidden] { display: none; }
    .stream_time_returns .stream_time_action::before { content: "↑"; color: var(--text, #27303b); font-size: 16px; }
    .stream_time_returns .stream_time_action.is_return_latest { width: 52px; border-radius: 999px; color: var(--text, #27303b); font-size: 11px; font-weight: 800; }
    .stream_time_returns .stream_time_action.is_return_latest::before { display: none; }
    .stream_years { flex-direction: row; gap: 16px; margin-top: 7px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
    .stream_years::-webkit-scrollbar { display: none; }
    .stream_year_button { width: auto; flex: 0 0 auto; padding: 2px 0; scroll-snap-align: start; }
    .stream_year_button::before { display: none; }
    .stream_year_button small { display: none; }
  }
  @media (max-width: 560px) {

    .stream_share_card_text { font-size: 16px; -webkit-line-clamp: 9; }
    .stream_share_foot { left: 24px; right: 24px; bottom: 24px; }
  }

<script>
(function () {
  var themeLink = document.getElementById('streamThemeStylesheet');
  var themeStateUrl = "/stream/theme.json";
  var themeCssUrl = "/stream/theme.css";
  var logoStateUrl = "/stream/logo.json";
  var themeClasses = ['theme-light-terminal', 'theme-light-terminal-moss', 'theme-light-terminal-graphite', 'theme-light-terminal-slate'];
  var classMap = {
    'light-terminal-moss': ['theme-light-terminal', 'theme-light-terminal-moss'],
    'light-terminal-graphite': ['theme-light-terminal', 'theme-light-terminal-graphite'],
    'light-terminal-slate': ['theme-light-terminal', 'theme-light-terminal-slate']
  };
  var currentVersion = "1792328124375";
  function applyThemeState(state) {
    if (!state || !state.theme) return;
    document.body.dataset.momentTheme = state.theme;
    document.body.classList.remove.apply(document.body.classList, themeClasses);
    var classes = classMap[state.theme];
    if (classes) document.body.classList.add.apply(document.body.classList, classes);
    var version = String(state.version || state.theme);
    if (themeLink && version !== currentVersion) {
      currentVersion = version;
      themeLink.href = themeCssUrl + '?v=' + encodeURIComponent(version);
    }
  }
  function syncTheme() {
    fetch(themeStateUrl + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(response) { if (!response.ok) throw Error(); return response.json(); })
      .then(applyThemeState)
      .catch(function() {});
  }
  function applyLogoState(state) {
    if (!state || (state.logo !== 'signature' && state.logo !== 'pencil')) return;
    document.querySelectorAll('[data-logo-style]').forEach(function(logo) {
      logo.classList.remove('logo_signature', 'logo_pencil');
      logo.classList.add('logo_' + state.logo);
      logo.setAttribute('data-logo-style', state.logo);
    });
  }
  function syncLogo() {
    fetch(logoStateUrl + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(response) { if (!response.ok) throw Error(); return response.json(); })
      .then(applyLogoState)
      .catch(function() {});
  }
  syncTheme();
  syncLogo();
  if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
    setInterval(syncTheme, 1500);
    setInterval(syncLogo, 1500);
  }
})();
</script>

    totalItemCount = Number(entry.count) || 0;
    totalPages = Number(entry.totalPages) || Math.max(1, Math.ceil(totalItemCount / pageSize));
    loadedPages = {};
    loadingPages = {};
    allItems = [];
    activeMinPage = 1;
    activeMaxPage = 1;
    suppressAutoLoad = true;
    container.innerHTML = '<div class="empty_state">正在打开 '+escHtml(year)+' 年...</div>';
    loadDataPage(1, false).then(function(loaded) {
      if (!loaded || generation !== dataGeneration) return;
      renderList(allItems);
      window.scrollTo({ top: 0, behavior: 'auto' });
      suppressAutoLoad = false;
      updateAutoLoader();
      updateReturnControls();
      updateActiveYear();
    }).catch(function() {
      if (generation !== dataGeneration) return;
      suppressAutoLoad = false;
      container.innerHTML = '<div class="empty_state">这一年的内容暂时无法打开。</div>';
    });
  }
  function loadOlder() {
    var page = activeMaxPage + 1;
    if (suppressAutoLoad || isSearchActive() || page > totalPages || loadingPages[page]) return;
    if (momentFocusSpacer) momentFocusSpacer.style.height = '0px';
    loadDataPage(page, true).then(function(loaded) {
      if (!loaded) return;
      activeMaxPage = page;
      trimPageWindow('older');
      updateAutoLoader();
    }).catch(function() {});
  }
  function loadNewer() {
    var page = activeMinPage - 1;
    if (suppressAutoLoad || isSearchActive() || page < 1 || loadingPages[page]) return;
    var anchor = container.querySelector('.list_item');
    var before = anchor ? anchor.getBoundingClientRect().top : 0;
    loadDataPage(page, true).then(function(loaded) {
      if (!loaded) return;
      if (momentFocusTopSpacer) momentFocusTopSpacer.style.height = '0px';
      activeMinPage = page;
      if (anchor && anchor.isConnected) window.scrollBy(0, anchor.getBoundingClientRect().top - before);
      trimPageWindow('newer');
      updateAutoLoader();
    }).catch(function() {});
  }
  function loadMore() { loadOlder(); }
  window.loadMore = loadMore;

  function hasMorePages() { return !suppressAutoLoad && !isSearchActive() && (viewMode === 'latest' || viewMode === 'focus' || viewMode === 'year') && activeMaxPage < totalPages; }
  function hasNewerPages() { return !suppressAutoLoad && !isSearchActive() && (viewMode === 'latest' || viewMode === 'focus' || viewMode === 'year') && activeMinPage > 1; }
  function updateAutoLoader() {
    if (autoLoadSentinel) autoLoadSentinel.style.display = hasMorePages() ? 'block' : 'none';
    if (autoLoadTopSentinel) autoLoadTopSentinel.style.display = hasNewerPages() ? 'block' : 'none';
  }
  function maybeLoadNextPage() {
    if (Date.now() > userScrollUntil || scrollDirection !== 'down' || !hasMorePages()) return;
    var doc = document.documentElement;
    var scrollTop = window.pageYOffset || doc.scrollTop || 0;
    var viewport = window.innerHeight || doc.clientHeight || 0;
    var remain = doc.scrollHeight - (scrollTop + viewport);
    if (remain < Math.max(420, viewport * 0.55)) loadOlder();
  }
  function maybeLoadPreviousPage() {
    if (Date.now() > userScrollUntil || scrollDirection !== 'up' || !hasNewerPages() || !autoLoadTopSentinel) return;
    if (autoLoadTopSentinel.getBoundingClientRect().bottom > -240) loadNewer();
  }
  if (autoLoadSentinel && 'IntersectionObserver' in window) {

    }, { root: null, rootMargin: '420px 0px', threshold: 0 });

  }
  if (autoLoadTopSentinel && 'IntersectionObserver' in window) {
    var autoLoadTopObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting && Date.now() <= userScrollUntil && scrollDirection === 'up') loadNewer();
      });
    }, { root: null, rootMargin: '240px 0px', threshold: 0 });
    autoLoadTopObserver.observe(autoLoadTopSentinel);
  }
  window.addEventListener('scroll', function() {
    var top = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (Math.abs(top - lastScrollTop) > 2) scrollDirection = top > lastScrollTop ? 'down' : 'up';
    lastScrollTop = top;
    maybeLoadNextPage();
    maybeLoadPreviousPage();
    scheduleActiveYearUpdate();
    updateReturnControls();
  }, { passive: true });
  window.addEventListener('wheel', function(e) {
    scrollDirection = e.deltaY >= 0 ? 'down' : 'up';
    userScrollUntil = Date.now() + 1200;
  }, { passive: true });
  var lastTouchY = 0;
  window.addEventListener('touchstart', function(e) {
    if (e.touches && e.touches[0]) lastTouchY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', function(e) {
    if (!e.touches || !e.touches[0]) return;
    var y = e.touches[0].clientY;
    scrollDirection = y < lastTouchY ? 'down' : 'up';
    lastTouchY = y;
    userScrollUntil = Date.now() + 1200;
  }, { passive: true });
  window.addEventListener('keydown', function(e) {
    if (['ArrowDown', 'PageDown', 'End', ' '].indexOf(e.key) >= 0) { scrollDirection = 'down'; userScrollUntil = Date.now() + 1200; }
    if (['ArrowUp', 'PageUp', 'Home'].indexOf(e.key) >= 0) { scrollDirection = 'up'; userScrollUntil = Date.now() + 1200; }
  });
  window.addEventListener('resize', updateAutoLoader);
  window.addEventListener('resize', scheduleActiveYearUpdate);
  window.addEventListener('resize', updateReturnControls);

  function checkHasMore() {
    updateAutoLoader();
  }

  renderList(allItems);
  checkHasMore();
  updateReturnControls();
  loadArchiveIndex();
  if (randomButton) {
    randomButton.addEventListener('click', function() {
      if (!totalItemCount) return;
      var globalTotal = archiveYears.reduce(function(sum, entry) { return sum + (Number(entry.count) || 0); }, 0) || totalItemCount;
      var ordinal = Math.floor(Math.random() * globalTotal);
      var page = Math.floor(ordinal / pageSize) + 1;
      var index = ordinal % pageSize;
      fetch(new URL(dataPageUrlPrefix + page + '.json', location.href).toString(), { credentials: 'same-origin' })
        .then(function(response) { if (!response.ok) throw Error(); return response.json(); })
        .then(function(data) {
        var choices = Array.isArray(data.items) ? data.items : [];
        if (!choices.length) return;
        var selected = choices[Math.min(index, choices.length - 1)];
        beginStandaloneView('random', [selected], 1);
      }).catch(function() {});
    });
  }
  if (todayButton) {
    todayButton.addEventListener('click', function() {
      if (!todayItems.length) {
        notify('今天还没有旧时光', 'success');
        return;
      }
      beginStandaloneView('today', todayItems.slice(), todayItems.length);
    });
  }
  if (yearList) {
    yearList.addEventListener('click', function(e) {
      var allButton = e.target.closest ? e.target.closest('[data-view="all"]') : null;
      if (allButton) {
        openLatest();
        return;
      }
      var button = e.target.closest ? e.target.closest('[data-year]') : null;
      if (!button) return;
      var year = button.getAttribute('data-year');
      openYear(year);
    });
  }
  if (topButton) topButton.addEventListener('click', scrollStreamToTop);
  container.addEventListener('click', function(e) {
    var btn = e.target.closest ? e.target.closest('[data-share-moment-id]') : null;
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    shareMoment(btn.getAttribute('data-share-moment-id'));
  });
  if (shareUrlButton) {
    shareUrlButton.addEventListener('click', function(e) {
      e.preventDefault();
      copyActiveShareUrl();
    });
  }
  if (shareOverlay) {
    shareOverlay.addEventListener('click', function(e) {
      if (e.target === shareOverlay || (e.target.closest && e.target.closest('[data-share-close]'))) {
        closeShareCard();
      }
    });
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeShareCard();
  });
  window.addEventListener('hashchange', function(){
    if (getMomentIdFromUrl()) focusMomentFromUrl();
    else {
      resetToFirstPage();
      checkHasMore();
      updateReturnControls();
    }
  });

  var manifestPromise, shardsPromise, indexItems = [], resultLimit = 80;
  function syncUrl(q) { try { var u=new URL(location.href); q?u.searchParams.set('q',q):u.searchParams.delete('q'); history.replaceState(null,'',u.toString()) } catch(e){} }
  function loadManifest() { if(manifestPromise)return manifestPromise; manifestPromise=fetch(new URL(manifestUrl,location.href).toString(),{credentials:'same-origin'}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(m){resultLimit=m.result_limit||resultLimit;return m}); return manifestPromise }
  function loadIndex() { if(shardsPromise)return shardsPromise; shardsPromise=loadManifest().then(function(m){return Promise.all((m.shards||[]).map(function(s){return fetch(new URL(s.url,location.origin).toString(),{credentials:'same-origin'}).then(function(r){if(!r.ok)throw Error();return r.json()})}))}).then(function(shards){indexItems=[];shards.forEach(function(s){if(Array.isArray(s.items))indexItems=indexItems.concat(s.items)});return indexItems}); return shardsPromise }
  function update() { var q=normalize(input.value); syncUrl(q); if(!q){if(getMomentIdFromUrl())focusMomentFromUrl();else renderList(allItems);checkHasMore();return} updateAutoLoader(); if(count)count.textContent='搜索中...'; loadIndex().then(function(all){var active=normalize(input.value),terms=active.split(/\s+/).filter(Boolean);if(!terms.length){update();return} var matches=all.filter(function(i){var h=normalize(i.search||i.text||i.title);return terms.every(function(t){return h.indexOf(t)!==-1})}); container.innerHTML=matches.slice(0,resultLimit).map(function(i){return buildItemHtml({id:i.id,type:(i.type||'').trim(),content:(i.text||i.title||''),date:i.date||'',tags:i.tags||[],pinned:i.pinned,link_image:i.link_image,link_title:i.link_title,link_description:i.link_description,url:i.external_url||i.url||''})}).join('')||'<div class="empty_state">没有找到匹配的瞬间。</div>'; checkExpandButtons(); if(count)count.textContent=matches.length+' / '+all.length }).catch(function(){if(count)count.textContent='搜索索引加载失败'}) }
  var iq=''; try{if(!getMomentIdFromUrl())iq=new URLSearchParams(location.search).get('q')||''}catch(e){} if(iq)input.value=iq; input.addEventListener('input',update); if(iq)update(); else loadArchiveIndex().then(focusMomentFromUrl);
})();
</script>
